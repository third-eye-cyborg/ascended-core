name: Codegen drift

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/api-contracts/**"

permissions:
  contents: read

concurrency:
  group: codegen-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: API contracts drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          npm install --global "pnpm@${PNPM_VERSION}"
          pnpm --version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build api-contracts
        run: pnpm --filter @third-eye-cyborg/api-contracts build

      - name: Run drift test
        run: pnpm --filter @third-eye-cyborg/api-contracts test
