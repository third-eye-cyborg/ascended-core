name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit:production

      - name: Third-party license and provenance check
        run: pnpm check:third-party

      - name: Generate production SPDX SBOM
        run: pnpm sbom:production

      - name: Upload production SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ascended-core-production-sbom
          path: /tmp/ascended-core-production.spdx.json

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary scan
        run: node scripts/checks/boundary-scan.mjs

      - name: Package smoke (CJS/ESM load + LICENSE in tarballs)
        run: node scripts/checks/package-smoke.mjs
