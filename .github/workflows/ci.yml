name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          npm install --global "pnpm@${PNPM_VERSION}"
          pnpm --version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit:production

      - name: Third-party license and provenance check
        run: pnpm check:third-party

      - name: Generate production SPDX SBOM
        run: node scripts/checks/third-party-compliance.mjs --sbom > sbom.spdx.json

      - name: Upload production SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ascended-core-production-sbom
          path: sbom.spdx.json

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary scan
        # BOUNDARY_SCAN_VERBOSE=1 ensures every binary-skipped file is listed
        # in CI logs, making the scanner's blind spot fully auditable without
        # a manual re-run.
        env:
          BOUNDARY_SCAN_VERBOSE: "1"
        run: node scripts/checks/boundary-scan.mjs

      - name: Setup Python 3.11 for ScanCode
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ScanCode Toolkit
        run: SCANCODE_PYTHON=$(which python3.11) bash scripts/checks/install-scancode.sh

      - name: Scan licenses and copyrights
        run: pnpm check:scancode

      - name: Third-party supply-chain check
        run: node scripts/checks/third-party-compliance.mjs --skip-network

      - name: Package smoke (CJS/ESM load + LICENSE in tarballs)
        run: node scripts/checks/package-smoke.mjs
