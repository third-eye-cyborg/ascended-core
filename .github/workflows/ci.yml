name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary scan
        # BOUNDARY_SCAN_VERBOSE=1 ensures every binary-skipped file is listed
        # in CI logs, making the scanner's blind spot fully auditable without
        # a manual re-run.
        env:
          BOUNDARY_SCAN_VERBOSE: "1"
        run: node scripts/checks/boundary-scan.mjs

      - name: Install ScanCode Toolkit
        run: bash scripts/checks/install-scancode.sh

      - name: Scan licenses and copyrights
        run: pnpm check:scancode

      - name: Third-party supply-chain check
        run: node scripts/checks/third-party-compliance.mjs --skip-network

      - name: Package smoke (CJS/ESM load + LICENSE in tarballs)
        run: node scripts/checks/package-smoke.mjs
