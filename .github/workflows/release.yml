name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run a publish dry-run without pushing to npm"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  dry-run:
    name: Publish dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary scan
        run: node scripts/checks/boundary-scan.mjs

      - name: Setup Python 3.11 for ScanCode
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ScanCode Toolkit
        run: SCANCODE_PYTHON=$(which python3.11) bash scripts/checks/install-scancode.sh

      - name: Scan licenses and copyrights
        run: pnpm check:scancode

      - name: License compliance
        run: node scripts/checks/third-party-compliance.mjs

      - name: Generate SBOM
        run: node scripts/checks/third-party-compliance.mjs --sbom > sbom.spdx.json

      - name: Validate SBOM
        run: node scripts/checks/validate-sbom.mjs sbom.spdx.json

      - name: Install Grype
        run: |
          GRYPE_VERSION="0.117.0"
          BASE_URL="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          curl -sSfL "${BASE_URL}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" -o grype.tar.gz
          curl -sSfL "${BASE_URL}/grype_${GRYPE_VERSION}_checksums.txt"       -o grype_checksums.txt
          grep "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype_checksums.txt | sha256sum --check --status
          tar -xzf grype.tar.gz grype
          sudo mv grype /usr/local/bin/grype

      - name: Vulnerability scan (Grype)
        run: grype sbom:sbom.spdx.json --fail-on high

      - name: Publish (dry-run)
        run: pnpm -r publish --no-git-checks --dry-run

      - name: Upload compliance reports
        uses: actions/upload-artifact@v4
        with:
          name: compliance-reports
          path: |
            sbom.spdx.json
            .reports/scancode/scancode.json

  release:
    name: Build, test & publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary scan
        run: node scripts/checks/boundary-scan.mjs

      - name: Setup Python 3.11 for ScanCode
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ScanCode Toolkit
        run: SCANCODE_PYTHON=$(which python3.11) bash scripts/checks/install-scancode.sh

      - name: Scan licenses and copyrights
        run: pnpm check:scancode

      - name: License compliance
        run: node scripts/checks/third-party-compliance.mjs

      - name: Generate SBOM
        run: node scripts/checks/third-party-compliance.mjs --sbom > sbom.spdx.json

      - name: Validate SBOM
        run: node scripts/checks/validate-sbom.mjs sbom.spdx.json

      - name: Install Grype
        run: |
          GRYPE_VERSION="0.117.0"
          BASE_URL="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          curl -sSfL "${BASE_URL}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" -o grype.tar.gz
          curl -sSfL "${BASE_URL}/grype_${GRYPE_VERSION}_checksums.txt"       -o grype_checksums.txt
          grep "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype_checksums.txt | sha256sum --check --status
          tar -xzf grype.tar.gz grype
          sudo mv grype /usr/local/bin/grype

      - name: Vulnerability scan (Grype)
        run: grype sbom:sbom.spdx.json --fail-on high

      - name: Publish public packages to npm
        run: pnpm -r publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload SBOM as release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: |
            sbom.spdx.json
            .reports/scancode/scancode.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom.spdx.json
            .reports/scancode/scancode.json
