name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  dry-run:
    name: Publish dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          npm install --global "pnpm@${PNPM_VERSION}"
          pnpm --version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Setup npm for trusted publishing
        run: |
          npm install --global npm@11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary scan
        run: node scripts/checks/boundary-scan.mjs

      - name: Setup Python 3.11 for ScanCode
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ScanCode Toolkit
        run: SCANCODE_PYTHON=$(which python3.11) bash scripts/checks/install-scancode.sh

      - name: Scan licenses and copyrights
        run: pnpm check:scancode

      - name: License compliance
        run: node scripts/checks/third-party-compliance.mjs

      - name: Generate SBOM
        run: node scripts/checks/third-party-compliance.mjs --sbom > sbom.spdx.json

      - name: Validate SBOM
        run: node scripts/checks/validate-sbom.mjs sbom.spdx.json

      # ── Vulnerability scan ──────────────────────────────────────────────────
      # Scans the generated SBOM against OSV, NVD, and GitHub Advisory databases
      # via Grype.  The step fails when any CRITICAL or HIGH severity CVE is
      # found in the resolved dependency set.
      #
      # FALSE-POSITIVE TRIAGE
      # ----------------------
      # 1. Run `grype sbom:sbom.spdx.json` locally to inspect the full report.
      # 2. Check https://github.com/advisories/<GHSA-…> or
      #    https://osv.dev/vulnerability/<CVE-…> for details on the matched
      #    vulnerability and whether the affected code path is actually reachable.
      # 3. If the finding is a confirmed false positive (e.g. the vulnerable code
      #    path is not reachable in our usage, or the CVE targets a platform we
      #    don't ship), add an ignore rule to .grype.yaml at the repo root:
      #
      #      ignore:
      #        - vulnerability: CVE-XXXX-XXXXX
      #          reason: "not reachable — only affects <platform/feature>"
      #
      # 4. Open a tracking issue so the ignore rule is revisited when an upstream
      #    fix is released and can replace the exemption.
      # Downloads the Grype binary from a pinned GitHub release tag (not from
      # the mutable main branch) and verifies its SHA-256 checksum against the
      # official checksums file before installing, so a compromised CDN or CI
      # runner cannot swap in a different binary undetected.
      - name: Install Grype
        run: |
          GRYPE_VERSION="0.117.0"
          BASE_URL="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          curl -sSfL "${BASE_URL}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" -o grype.tar.gz
          curl -sSfL "${BASE_URL}/grype_${GRYPE_VERSION}_checksums.txt"       -o grype_checksums.txt
          EXPECTED=$(grep "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype_checksums.txt | awk '{print $1}')
          echo "${EXPECTED}  grype.tar.gz" | sha256sum --check --status
          tar -xzf grype.tar.gz grype
          sudo mv grype /usr/local/bin/grype

      - name: Vulnerability scan (Grype)
        run: grype sbom:sbom.spdx.json --fail-on high

      - name: Setup pnpm for trusted publishing
        run: |
          npm install --global pnpm@10.16.0
          pnpm --version

      - name: Verify npm publish access
        run: pnpm check:npm-publish-access

      - name: Publish (dry-run)
        run: pnpm --filter "./packages/*" -r publish --access public --no-git-checks --dry-run

      - name: Upload compliance reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-reports
          path: |
            sbom.spdx.json
            .reports/scancode/scancode.json

  release:
    name: Build, test & publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          npm install --global "pnpm@${PNPM_VERSION}"
          pnpm --version

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Setup npm for trusted publishing
        run: |
          npm install --global npm@11.5.1
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary scan
        run: node scripts/checks/boundary-scan.mjs

      - name: Setup Python 3.11 for ScanCode
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ScanCode Toolkit
        run: SCANCODE_PYTHON=$(which python3.11) bash scripts/checks/install-scancode.sh

      - name: Scan licenses and copyrights
        run: pnpm check:scancode

      - name: License compliance
        run: node scripts/checks/third-party-compliance.mjs

      - name: Generate SBOM
        run: node scripts/checks/third-party-compliance.mjs --sbom > sbom.spdx.json

      - name: Validate SBOM
        run: node scripts/checks/validate-sbom.mjs sbom.spdx.json

      # ── Vulnerability scan ──────────────────────────────────────────────────
      # Scans the generated SBOM against OSV, NVD, and GitHub Advisory databases
      # via Grype.  The step fails when any CRITICAL or HIGH severity CVE is
      # found in the resolved dependency set.
      #
      # FALSE-POSITIVE TRIAGE
      # ----------------------
      # 1. Run `grype sbom:sbom.spdx.json` locally to inspect the full report.
      # 2. Check https://github.com/advisories/<GHSA-…> or
      #    https://osv.dev/vulnerability/<CVE-…> for details on the matched
      #    vulnerability and whether the affected code path is actually reachable.
      # 3. If the finding is a confirmed false positive (e.g. the vulnerable code
      #    path is not reachable in our usage, or the CVE targets a platform we
      #    don't ship), add an ignore rule to .grype.yaml at the repo root:
      #
      #      ignore:
      #        - vulnerability: CVE-XXXX-XXXXX
      #          reason: "not reachable — only affects <platform/feature>"
      #
      # 4. Open a tracking issue so the ignore rule is revisited when an upstream
      #    fix is released and can replace the exemption.
      # Downloads the Grype binary from a pinned GitHub release tag (not from
      # the mutable main branch) and verifies its SHA-256 checksum against the
      # official checksums file before installing, so a compromised CDN or CI
      # runner cannot swap in a different binary undetected.
      - name: Install Grype
        run: |
          GRYPE_VERSION="0.117.0"
          BASE_URL="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          curl -sSfL "${BASE_URL}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" -o grype.tar.gz
          curl -sSfL "${BASE_URL}/grype_${GRYPE_VERSION}_checksums.txt"       -o grype_checksums.txt
          EXPECTED=$(grep "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" grype_checksums.txt | awk '{print $1}')
          echo "${EXPECTED}  grype.tar.gz" | sha256sum --check --status
          tar -xzf grype.tar.gz grype
          sudo mv grype /usr/local/bin/grype

      - name: Vulnerability scan (Grype)
        run: grype sbom:sbom.spdx.json --fail-on high

      - name: Setup pnpm for trusted publishing
        run: |
          npm install --global pnpm@10.16.0
          pnpm --version

      - name: Verify npm publish access
        run: pnpm check:npm-publish-access

      - name: Publish public packages to npm
        run: pnpm --filter "./packages/*" -r publish --access public --provenance --no-git-checks

      - name: Upload SBOM as release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-json
          path: |
            sbom.spdx.json
            .reports/scancode/scancode.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            sbom.spdx.json \
            .reports/scancode/scancode.json
