# TEMPORARY backup CI for ascended-core.
#
# GitHub Actions is the primary CI (.github/workflows/). This Buildkite
# pipeline only exists while Actions is unavailable for this repository and
# should be removed once Actions is running again. See docs/ci.md.
#
# Mirrors .github/workflows/ci.yml (and codegen-drift.yml when the API
# contracts change). Not mirrored: pr-title.yml (needs PR metadata),
# release.yml (publishing stays on Actions), and CodeQL (GitHub-only).
#
# Security: no secrets are used by any step. Fork pull requests are not built.

env:
  CI: "true"

x-node: &node
  docker#v5.13.0:
    image: "node:22-bookworm"
    environment:
      - "CI"
      - "BOUNDARY_SCAN_VERBOSE"

steps:
  - label: ":nodejs: Lint, typecheck, test & build"
    key: build
    agents:
      queue: linux-medium
    timeout_in_minutes: 30
    env:
      BOUNDARY_SCAN_VERBOSE: "1"
    plugins:
      - *node
    command: |
      set -euo pipefail
      bash .buildkite/scripts/setup-pnpm.sh
      echo "--- :pnpm: Install dependencies"
      pnpm install --frozen-lockfile
      echo "--- :lock: Production dependency audit"
      pnpm audit:production
      echo "--- :eslint: Lint"
      pnpm lint
      echo "--- :typescript: Typecheck"
      pnpm typecheck
      echo "--- :vitest: Test"
      pnpm test
      echo "--- :package: Build"
      pnpm build
      echo "--- :mag: Boundary scan"
      node scripts/checks/boundary-scan.mjs
      echo "--- :package: Package smoke (CJS/ESM load + LICENSE in tarballs)"
      node scripts/checks/package-smoke.mjs

  - label: ":scales: License, provenance, SBOM & ScanCode"
    key: compliance
    agents:
      queue: linux-medium
    timeout_in_minutes: 45
    artifact_paths:
      - "sbom.spdx.json"
      - ".reports/scancode/scancode.json"
    plugins:
      - *node
    command: |
      set -euo pipefail
      bash .buildkite/scripts/setup-pnpm.sh
      echo "--- :python: Python 3.11 for ScanCode"
      apt-get update -qq
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-venv python3-dev >/dev/null
      python3 --version
      echo "--- :pnpm: Install dependencies"
      pnpm install --frozen-lockfile
      echo "--- :scales: Third-party license and provenance check"
      pnpm check:third-party
      echo "--- :page_facing_up: Generate production SPDX SBOM"
      node scripts/checks/third-party-compliance.mjs --sbom > sbom.spdx.json
      echo "--- :hammer_and_wrench: Install ScanCode Toolkit"
      SCANCODE_PYTHON="$$(command -v python3.11 || command -v python3)" bash scripts/checks/install-scancode.sh
      echo "--- :mag: Scan licenses and copyrights"
      pnpm check:scancode
      echo "--- :link: Third-party supply-chain check"
      node scripts/checks/third-party-compliance.mjs --skip-network

  - label: ":triangular_ruler: API contracts drift check"
    key: codegen-drift
    agents:
      queue: linux-medium
    timeout_in_minutes: 20
    if_changed: "packages/api-contracts/**"
    plugins:
      - *node
    command: |
      set -euo pipefail
      bash .buildkite/scripts/setup-pnpm.sh
      pnpm install --frozen-lockfile
      pnpm --filter @third-eye-cyborg/api-contracts build
      pnpm --filter @third-eye-cyborg/api-contracts test
